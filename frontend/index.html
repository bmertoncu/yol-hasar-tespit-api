<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yol Hasar Tespit Sistemi</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 600px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .upload-zone { border: 3px dashed #cbd5e1; padding: 40px; border-radius: 15px; cursor: pointer; color: #64748b; margin-bottom: 20px; }
        #container { position: relative; width: 100%; display: none; margin-top: 20px; }
        #img { width: 100%; display: block; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #sendBtn { display: none; width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Yol Hasar Analiz Paneli</h2>
        <div class="upload-zone" id="dropZone"><p>Görsel Seçmek İçin Tıkla</p><input type="file" id="fileInput" accept="image/*" style="display: none;"></div>
        <div id="container"><img id="img" src=""><canvas id="canvas"></canvas></div>
        <button id="sendBtn">Analiz Raporunu Gönder</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
